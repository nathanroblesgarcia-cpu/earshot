<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Earshot{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top">
  <a class="brand" href="{{ url_for('index') }}"><span class="dot" id="navdot"></span>Earshot</a>
  <nav>
    <a href="{{ url_for('index') }}">Meetings</a>
    <a href="{{ url_for('actions') }}">Action items</a>
    <a href="{{ url_for('people_list') }}">People</a>
  </nav>
  <form class="search" action="{{ url_for('search') }}">
    <input name="q" placeholder="Search every meeting" value="{{ q or '' }}" aria-label="Search">
  </form>
</header>
<main>{% block body %}{% endblock %}</main>
<script>
// Red dot in the header whenever a recording is running, on every page.
async function pollNav() {
  try {
    const s = await (await fetch('/api/status')).json();
    document.getElementById('navdot').classList.toggle('live', s.recording);
    if (window.onStatus) window.onStatus(s);
  } catch (e) {}
}
pollNav(); setInterval(pollNav, 1000);
</script>
{% block script %}{% endblock %}
</body>
</html>
